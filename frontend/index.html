<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cypher - Automated university results retrieval and analysis tool">
    <title>Cypher | University Results Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="bg-decoration"></div>

    <div class="container">
        <!-- Compact Search Bar (Initially Centered) -->
        <div id="searchContainer" class="search-container centered">
            <div class="brand">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
                        <rect width="40" height="40" rx="12" fill="#667eea" />
                        <path d="M20 10L30 20L20 30" stroke="white" stroke-width="3" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M10 20H25" stroke="white" stroke-width="3" stroke-linecap="round" />
                        
                    </svg>
                </div>
                <h1>Cypher</h1>
            </div>

            <form id="resultsForm" class="compact-form">
                <input type="text" id="hallTicket" placeholder="Enter Hall Ticket Number" autocomplete="off"
                    spellcheck="false" maxlength="20">
                <button type="submit" id="submitBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
                <input type="hidden" id="examType" value="">
                <input type="hidden" id="viewType" value="All Semesters">
            </form>
            <div id="loadingState" class="mini-loader" style="display: none;"></div>
            <div id="errorState" class="compact-error" style="display: none;"></div>
        </div>

        <!-- Batch Fetch & Favorites Panel -->
        <div id="batchPanel" class="batch-panel" style="display: none;">
            <!-- Tab Bar -->
            <div class="batch-tabs">
                <button class="batch-tab active" onclick="switchBatchTab('batch', this)">Batch Fetch</button>
                <button class="batch-tab" onclick="switchBatchTab('favorites', this)">⭐ Favorites</button>
            </div>

            <!-- Batch Fetch Tab -->
            <div id="batchTab" class="batch-tab-content">
                <p class="batch-hint">Enter one roll number per line, or separate with commas. You can also upload a CSV file.</p>
                <textarea id="batchInput" class="batch-textarea" placeholder="E.g.&#10;22A91A0501&#10;22A91A0502&#10;22A91A0503" rows="5"></textarea>
                <div class="batch-actions">
                    <label class="csv-upload-btn">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Upload CSV
                        <input type="file" id="csvFileInput" accept=".csv,.txt" style="display:none" onchange="loadCSVFile(this)">
                    </label>
                    <button class="btn-primary" onclick="startBatchFetch()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Fetch All
                    </button>
                </div>
                <div id="batchLoading" style="display:none;" class="batch-loading">
                    <div class="mini-loader"></div>
                    <span id="batchProgress">Fetching results…</span>
                </div>
            </div>

            <!-- Favorites Tab -->
            <div id="favoritesTab" class="batch-tab-content" style="display:none;">
                <div id="favoritesList" class="favorites-list">
                    <div class="fav-empty">No favorites saved yet. Star a student's result to save them here.</div>
                </div>
                <div class="batch-actions" style="margin-top: 1rem;">
                    <button class="btn-primary" onclick="fetchAllFavorites()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Fetch All Favorites
                    </button>
                </div>
            </div>
        </div>

        <!-- Batch Results Table -->
        <div id="batchResults" style="display: none;" class="batch-results-panel">
            <div class="batch-results-header">
                <h3>Batch Results</h3>
                <div id="batchSummaryBadge" class="batch-summary-badge"></div>
            </div>
            <div class="batch-table-wrapper">
                <table class="batch-table">
                    <thead>
                        <tr>
                            <th>Hall Ticket</th>
                            <th>Name</th>
                            <th>Program</th>
                            <th>CGPA</th>
                            <th>Backlogs</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="batchTableBody"></tbody>
                </table>
            </div>
            <div id="batchErrors" class="batch-errors" style="display:none;"></div>
        </div>

        <!-- Results Dashboard -->
        <div id="resultsDashboard" class="dashboard" style="display: none;">
            <!-- Hero Profile Section -->
            <div id="heroProfile" class="hero-profile fade-in"></div>

            <!-- Content Grid-->
            <div class="content-grid">
                <!-- Left Column: KPI & Summary -->
                <div class="aside-column fade-in-delay-1">
                    <div id="statsGrid" class="stats-grid-compact"></div>

                    <!-- Numeric Semester Summary (Replaces Graph) -->
                    <div class="chart-card">
                        <h3>Semester Performance</h3>
                        <div id="semesterSummaryGrid" class="sem-summary-grid">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Right Column: Semester Results -->
                <div class="main-column fade-in-delay-2">
                    <div id="semestersContainer" class="semesters-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
